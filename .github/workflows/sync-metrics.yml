name: Threads メトリクス同期

on:
  schedule:
    # JST 8:00 / 8:30 ... 23:30 相当（UTC 0-14時台の毎時0分・30分 + 23時台）
    - cron: "0,30 0-14,23 * * *"
  workflow_dispatch: {}

concurrency:
  group: sync-metrics
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: メトリクスをNotionへ同期
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: python src/sync_metrics.py

      - name: ダッシュボードの更新をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/kpi_data.json
          git diff --cached --quiet || git commit -m "chore: update kpi_data (sync-metrics)"
          git push
