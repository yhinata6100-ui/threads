name: Threads 予約投稿

on:
  schedule:
    # 毎日 JST 8:00-23:55 の間、10分おき（UTCではまたぐため 0-14時 と 23時 に分割）
    - cron: "*/10 0-14,23 * * *"
  workflow_dispatch: {}

concurrency:
  group: post-scheduled
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: 予約投稿を実行
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: python src/post_scheduled.py

      - name: ダッシュボードの更新をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/kpi_data.json
          git diff --cached --quiet || git commit -m "chore: update kpi_data (post-scheduled)"
          git push
